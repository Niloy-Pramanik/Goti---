spring:
  application:
    name: prokoi-backend

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/prokoi}
    username: ${DB_USERNAME:prokoi}
    password: ${DB_PASSWORD:prokoi}
    driver-class-name: org.postgresql.Driver

  flyway:
    enabled: true
    locations: classpath:db/migration

  jackson:
    default-property-inclusion: non_null

server:
  port: 8080

app:
  jwt:
    secret: ${JWT_SECRET:default-dev-secret-change-me-in-production-min-32-chars!!}
    expiration-ms: 86400000  # 24 hours
