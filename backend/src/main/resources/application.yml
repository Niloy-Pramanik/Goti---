spring:
  application:
    name: prokoi-backend

  datasource:
    url: jdbc:postgresql://localhost:5432/prokoi
    driverClassName: org.postgresql.Driver
    username: prokoi
    password: 

  flyway:
    enabled: true
    locations: classpath:db/migration

  jackson:
    default-property-inclusion: non_null

server:
  port: 8080

app:
  jwt:
    secret: ${JWT_SECRET:default-dev-secret-change-me-in-production-min-32-chars!!}
    expiration-ms: 86400000  # 24 hours
  frontend:
    url: ${FRONTEND_URL:http://localhost:5174}
