spring:
  application:
    name: prokoi-backend

  datasource:
    url: jdbc:h2:mem:prokoi;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH
    driverClassName: org.h2.Driver
    username: sa
    password: password

  h2:
    console:
      enabled: true
      path: /h2-console

  flyway:
    enabled: true
    locations: classpath:db/migration

  jackson:
    default-property-inclusion: non_null

server:
  port: 8080

app:
  jwt:
    secret: ${JWT_SECRET:default-dev-secret-change-me-in-production-min-32-chars!!}
    expiration-ms: 86400000  # 24 hours
